[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = mouse_left
b = mouse_right
x = mouse_slow
y = "esc"

start = "enter"
back = "esc"

l1 = "f1"
r1 = "b"
l2 = "f9"
r2 = "f12"

up = "up"
down = "down"
left = "left"
right = "right"

left_analog = mouse_movement

right_analog_up = "up"
right_analog_down = "down"
right_analog_left = "left"
right_analog_right = "right"
